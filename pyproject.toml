[project]
name = "home-climate-orchestrator"
version = "0.1.0a1"
description = "Observation-only, tariff-aware home climate planner for Home Assistant"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_domain.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
