name: Tests and secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tests
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        version: ['2026.10.4', '2026.11.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pull tested Home Assistant image
        run: docker pull ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - name: Isolated Home Assistant smoke
        run: >-
          timeout 90s docker run --rm --pull=never -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_smoke.py
      - name: Native setup, reload and unload
        run: >-
          timeout 90s docker run --rm --pull=never -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_lifecycle.py
      - name: Native integration and split configuration flows
        run: >-
          timeout 90s docker run --rm --pull=never -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_config_flow.py
      - name: Native execution and energy (fictional appliances only)
        run: >-
          timeout 90s docker run --rm --pull=never -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_execution.py
      - name: Native editable ambient targets (no physical control)
        run: >-
          timeout 90s docker run --rm --pull=never -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_number.py
      - name: Native humidity, dehumidifier and accounting (fictional devices only)
        run: >-
          timeout 90s docker run --rm --pull=never --network none --memory 512m --cpus 1
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_humidity_accounting.py
      - name: Native feedback loss and OFF display (fictional devices only)
        run: >-
          timeout 90s docker run --rm --pull=never --network none --memory 512m --cpus 1
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_feedback_display.py
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan all history with verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact=100 --no-banner --log-opts=--all .
