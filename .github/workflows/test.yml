name: Tests and secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tests
  ha:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2026.10.4', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - name: Isolated Home Assistant smoke
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_smoke.py
      - name: Native setup, reload and unload
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          tests/ha_lifecycle.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all history with verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact=100 --no-banner --log-opts=--all .
